plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

group = mod_group_id
version = mod_version
base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        yasm {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // jGLTF: MIT-licensed glTF model reader. Keep the dependency surface minimal.
    implementation 'de.javagl:jgltf-model:3.0.1'
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.srcDir 'src/main/templates'

processResources {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// A lightweight report of resolved runtime dependencies. Review licenses manually
// before adding or bundling any new dependency.
tasks.register('printRuntimeDependencies') {
    group = 'help'
    description = 'Prints runtime dependencies for the third-party license audit.'
    doLast {
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .sort { it.moduleVersion.id.toString() }
                .each { println "${it.moduleVersion.id} -> ${it.file.name}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}
